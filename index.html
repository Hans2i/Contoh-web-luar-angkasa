(function () {

    if (typeof KARTU !== 'undefined') return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a0710;color:#fff;font:16px/1.65 system-ui,sans-serif;padding:26px;overflow:auto';
    var h = document.createElement('h2'); h.textContent = '⚠️ Ada salah ketik di PENGATURAN KARTU'; h.style.color = '#ff9db8'; d.appendChild(h);
    var p = document.createElement('div');
    p.innerHTML = 'Buka file <b>index.html</b>, lihat bagian <b>PENGATURAN KARTU</b> di paling atas, lalu periksa:<ol>' +
      '<li>Tanda <b>`</b> (backtick, tombol di kiri angka 1) di awal dan akhir setiap teks <b>tidak ada yang terhapus</b>.</li>' +
      '<li><b>Koma ( , )</b> di ujung setiap baris tidak terhapus.</li>' +
      '<li>Di dalam teks <b>tidak ada</b> karakter <b>`</b> atau <b>${</b>.</li>' +
      '<li>Tanda kurung kurawal <b>{ }</b> dan <b>[ ]</b> tidak terhapus.</li></ol>';
    d.appendChild(p);
    if (first) { var t = document.createElement('div'); t.style.cssText = 'margin-top:14px;font:13px/1.5 monospace;color:#ffd0dd'; t.textContent = 'Pesan teknis: ' + first.msg + (first.line ? ' (sekitar baris ' + first.line + ')' : ''); d.appendChild(t); }
    document.body.appendChild(d);
  });
})();
</script>

const KARTU_WARN = [];
(function prepKartu() {
  const K = KARTU, N = t => Array.from(t).length;
  const cutText = (t, max) => {
    let a = Array.from(t).slice(0, max - 1).join(''); const sp = a.lastIndexOf(' ');
    if (sp > max * .6) a = a.slice(0, sp);

  };

  for (const k in BATAS) {
    let v = String(K[k] == null ? '' : K[k]).replace(/\r/g, '').replace(/^\uFEFF/, '').trim();
    if (N(v) > BATAS[k]) { KARTU_WARN.push(k + ' : ' + N(v) + ' huruf, batasnya ' + BATAS[k] + ' → dipotong otomatis'); v = cutText(v, BATAS[k]); }

    else K[k] = v;
  };
  num('BLN_LAHIR', 1, 12, 12); num('TGL_LAHIR', 1, 31, 25);
  const dim = new Date(2024, K.BLN_LAHIR, 0).getDate();
  if (K.TGL_LAHIR > dim) { KARTU_WARN.push('TGL_LAHIR : bulan ke-' + K.BLN_LAHIR + ' hanya punya ' + dim + ' hari → dipakai ' + dim); K.TGL_LAHIR = dim; }
  const thn = Number(K.THN_LAHIR);

})();
/* menerjemahkan "kata ajaib" seperti {nama} menjadi isi sebenarnya */
function fill(str, extra) {
  const v = Object.assign({ nama: DATA.name, pemberi: DATA.giver, usia: DATA.age || '', usia_en: DATA.age ? DATA.age + ordinal(DATA.age) : '' }, extra || {});
  return String(str == null ? '' : str).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)).replace(/(\S) {2,}(\S)/g, '$1 $2').trim();

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ========================================================================

const CFG = {
  SONG_FILE : (KARTU.AKTIF_MUSIK === false ? '' : KARTU.LAGU) || '',                // diatur di CUS-01 (paling atas file)

const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
const Q = IS_MOBILE
  ? {disc:32000,bulge:9000,halo:2500,haze:3000,dust:4000,bgStars:7000,bgBand:6000,hOut:1600,hIn:800,hFill:2600,hText:1100,hSmoke:350}

/* ========================= UTIL ========================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO3 = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

/* ========================================================================

   ======================================================================== */
/* judul jendela dikecilkan otomatis agar muat 1 baris; jika tetap tak muat, dibagi 2 baris seimbang SEBELUM mengetik (tidak pindah baris saat diketik) */
async function fitTitle(el, text) {
  try { await document.fonts.ready; } catch (e) {}
  el.style.fontSize = ''; el.style.whiteSpace = 'nowrap';
  const sp = document.createElement('span'); sp.textContent = text; el.textContent = ''; el.appendChild(sp);
  const room = el.clientWidth - 46;                      // sisakan tempat untuk tombol tutup
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (sp.offsetWidth > room && fs > 21) { fs -= 1; el.style.fontSize = fs + 'px'; }
  if (sp.offsetWidth > room) { el.style.fontSize = ''; el.style.whiteSpace = ''; }
}
async function typeEl(el, text, opt = {}) {
  const tok = opt.tok || { cancel: false };
  const speed = opt.speed || CFG.TYPE_MS;
  text = text.replace(/[ \t]+((?:\p{Extended_Pictographic}|\uFE0F|\u200D)+)$/u, '\u00A0$1');   // emoji di ujung selalu menempel dengan kata terakhir
  if (el.classList.contains('m-title')) { await fitTitle(el, text); if (tok.cancel) return false; }
  el.textContent = '';
  const node = document.createTextNode('');
  const caret = document.createElement('span'); caret.className = 'caret';
  const rest = document.createElement('span'); rest.style.visibility = 'hidden'; rest.textContent = text;   // sisa teks: tak terlihat, tapi sudah memakan tempat
  el.appendChild(node); el.appendChild(caret); el.appendChild(rest);
  const chars = Array.from(text); let buf = '';
  for (let n = 0; n < chars.length; n++) {
    const ch = chars[n];
    if (tok.cancel) { caret.remove(); return false; }
    buf += ch; node.nodeValue = buf; rest.textContent = chars.slice(n + 1).join('');
    if (opt.scroll) opt.scroll.scrollTop = opt.scroll.scrollHeight;
    let d = speed;
    if ('.!?'.includes(ch)) d += CFG.PAUSE_END;
    else if (',;:'.includes(ch)) d += CFG.PAUSE_MID;
    else if (ch === '\n') d += CFG.PAUSE_NL;
    await sleep(d);
  }
  rest.remove();
  if (!opt.keepCaret) caret.remove();
  return true;
}

/* ========================================================================

let DATA = { giver: 'Aku', name: 'Sayang', age: 0, day: 25, month: 11, birthYear: null, letter: '', prayer: '' };

        const K = [[0, top], [.36, c.y1 + ov], [.58, c.y1 - ov * .38], [.78, c.y1 + ov * .14], [1, c.y1]]; y = c.y1;
        for (let k = 1; k < K.length; k++) if (p <= K[k][0]) { const u = (p - K[k - 1][0]) / (K[k][0] - K[k - 1][0]); y = K[k - 1][1] + (K[k][1] - K[k - 1][1]) * ease(u); break; }
      } else {                        // KELUAR: turun sedikit dulu, baru melesat naik ke bawah judul
        const q = Math.min(1, (now - c.outAt) / OUT_DUR), yd = c.y1 + Math.max(26, H * .15), a = .26;
        y = q < a ? c.y1 + (yd - c.y1) * Math.sin(q / a * Math.PI / 2) : yd + (top - yd) * Math.pow((q - a) / (1 - a), 3);
        ang *= 1 - .7 * q; strOp = 1 - Math.max(0, (q - .75) / .25);

      }

    });

  }
  M.open = async () => {
    if (M.active || !M.ready || !PHOTOS.length) return;
    M.active = true; $('#tip').classList.remove('in');
    if (!built) build();
    document.body.classList.add('memo-on'); layout(); box.classList.add('on');
    const t0 = performance.now(), n = cards.length;
    const hold = t0 + IN_DELAY + (n - 1) * IN_STAG + IN_DUR * .85 + KARTU.DURASI_FOTO * 1000;
    cards.forEach((c, i) => { c.inAt = t0 + IN_DELAY + i * IN_STAG; c.outAt = hold + i * OUT_STAG; c.ph = Math.random() * 6.28; });
    await new Promise(done => { const loop = now => { const alive = tick(now); if (now > hold && alive === 0) return done(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
    await sleep(150); box.classList.remove('on'); await sleep(1000);
    document.body.classList.remove('memo-on'); M.active = false;
  };
  addEventListener('resize', () => { if (M.active && cards.length) layout(); });
  return M;
})();
function pickHeartText() {
  if (!Memo.ready || Memo.active || !heartHit) return false;
  ray.setFromCamera(ptr, camera); return ray.intersectObject(heartHit).length > 0;
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let ptrMoved = false, hoverIcon = null, down = null;
const tip = $('#tip');
canvas.addEventListener('pointermove', e => { ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ptrMoved = true; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); });
canvas.addEventListener('pointerup', e => {
  if (!down || state.stage !== 'explore' || Modal.isOpen) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null; if (moved > 8) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  const hit = pickIcon(); if (hit) openIcon(hit.def.type, iconScreenPos(hit));
  else if (pickHeartText()) Memo.open();
});
canvas.addEventListener('pointerleave', () => { hoverIcon = null; tip.classList.remove('in'); });
function pickIcon() {
  ray.setFromCamera(ptr, camera);
  const objs = clickables.filter(c => c.k > .6).map(c => c.sp), hits = ray.intersectObjects(objs);
  return hits.length ? hits[0].object.userData.icon : null;
}

/* ========================================================================
   [KODE: KOD-01] LABEL KODE
   ======================================================================== */
const badges = []; let kodeTimer = null;
function toggleKode() {
  document.body.classList.toggle('show-kode');
  if (document.body.classList.contains('show-kode')) { updateBadges(); kodeTimer = setInterval(updateBadges, 300); }
  else { clearInterval(kodeTimer); badges.forEach(b => b.remove()); badges.length = 0; }
}
function updateBadges() {
  let n = 0;
  const place = (text, left, top) => {
    let b = badges[n]; if (!b) { b = document.createElement('div'); b.className = 'kbadge'; document.body.appendChild(b); badges[n] = b; }
    b.textContent = text; b.style.left = Math.max(2, left) + 'px'; b.style.top = Math.max(2, top - 12) + 'px'; b.style.display = 'block'; n++;
  };
  for (const el of document.querySelectorAll('[data-kode]')) {
    const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    if (r.width < 2 || r.height < 2 || cs.visibility === 'hidden' || r.bottom < 0 || r.top > innerHeight) continue;
    place(el.dataset.kode, r.left, r.top);
  }
  if (state.stage === 'explore' && !Modal.isOpen) {   // label untuk objek 3D
    const put = (code, v) => { const q = v.clone().project(camera); if (q.z > 1 || Math.abs(q.x) > 1 || Math.abs(q.y) > 1) return; place(code, (q.x * .5 + .5) * innerWidth, (-q.y * .5 + .5) * innerHeight); };
    [['4B', [46, 0, 22]], ['4C', [0, .5, 0]], ['4D', [-24, 52, 0]], ['4E', [0, 34, 0]]].forEach(a => put(a[0], new THREE.Vector3(...a[1])));
    clickables.forEach(it => { if (it.k > .5) put(it.def.code, it.sp.position); });
    decor.forEach(it => { if (it.sp.material.opacity > .5) put('5E', it.sp.getWorldPosition(new THREE.Vector3())); });
  }
  for (let i = n; i < badges.length; i++) badges[i].style.display = 'none';
}
/* kode layar yang sedang tampil, kecil di pojok kiri bawah */
const kodeNowEl = $('#kode-now'); let kodeNowTxt = '';
function partCodes() {
  if (Modal.isOpen) return state.modalCode || '6C';
  switch (state.stage) {
    case 'loading': return '1A';
    case 'puzzle': return '2A';
    case 'warp-prep': case 'warp': return '3A';
    case 'arrived': case 'explore': return '4A';
  }
  return '';
}
function refreshKodeNow() {
  const t = partCodes(); if (t === kodeNowTxt) return; kodeNowTxt = t;
  kodeNowEl.style.opacity = 0; setTimeout(() => { kodeNowEl.textContent = t; kodeNowEl.style.opacity = ''; }, 260);
}
$('#kode-btn').addEventListener('click', toggleKode);

/* ========================================================================
   [KODE: HNT-01] petunjuk bawah & judul 3D
   ======================================================================== */
async function setHint(text) {
  const h = $('#hint'); h.classList.remove('in'); await sleep(900);
  h.classList.add('in'); await typeEl(h, text);
}

/* ========================================================================
   [KODE: WRP-10] MASUK → PERJALANAN KE GALAKSI TERBESAR
   ======================================================================== */
const LOOK_Y = 22;   // kamera menatap titik setinggi ini (di antara galaksi & hati)
/* [KODE: 4F] judul "Happy ... Birthday" diletakkan tepat di tengah antara tepi atas layar dan puncak hati,
   dihitung dari posisi kamera awal (jadi proporsional di HP maupun PC) */
function placeTitle() {
  const asp = innerWidth / innerHeight, D = Math.max(95, 74 / (Math.tan(THREE.MathUtils.degToRad(30)) * asp));
  const c = new THREE.PerspectiveCamera(60, asp, .1, 40000);
  c.position.set(0, LOOK_Y + D * .36, D); c.lookAt(0, LOOK_Y, 0); c.updateMatrixWorld(); c.updateProjectionMatrix();
  const top = new THREE.Vector3(0, 60, 0).project(c);                 // puncak hati
  const topPx = (-top.y * .5 + .5) * innerHeight;
  $('#title3d').style.top = Math.max(34, topPx / 2) + 'px';            // transform:translateY(-50%) membuat teksnya rata tengah
}
const warp = { active: false, t0: 0, dur: 9000, prevZ: 4200, finalPos: new THREE.Vector3(0, 30, 140), startPos: new THREE.Vector3(0, 260, 4200) };
async function enterGalaxy() {
  if (state.stage !== 'puzzle') return; state.stage = 'warp-prep';
  if (store.songUrl && audio.paused && !userPaused) audio.play().catch(() => {});
  $('#btn-masuk').classList.remove('in'); $('#puzzle').classList.remove('show');
  await sleep(1400);
  const asp = innerWidth / innerHeight, D = Math.max(95, 74 / (Math.tan(THREE.MathUtils.degToRad(30)) * asp));
  warp.finalPos.set(0, LOOK_Y + D * .36, D);
  $('#warp').classList.add('show');
  warp.active = true; warp.t0 = performance.now(); state.stage = 'warp';
  await sleep(500);
  const w = $('#warp-text'); w.style.transition = 'opacity 1s'; w.style.opacity = 1;
  await typeEl(w, KARTU.TEKS_PERJALANAN, { keepCaret: false });
}
async function onArrive() {
  state.stage = 'arrived';
  $('#warp').classList.remove('show');
  controls.target.set(0, LOOK_Y, 0); camera.position.copy(warp.finalPos); controls.update(); controls.enabled = true; state.stage = 'explore';
  placeTitle();
  await sleep(1200);
  heartT0 = performance.now();                       // mulai ribuan bintang keluar dari tengah galaksi
  await sleep(5200);
  const t = $('#title3d'); t.classList.add('in');
  await typeEl(t, fill(KARTU.JUDUL_GALAKSI));
  iconsStart = performance.now() + 1500;
  /* petunjuk BARU muncul setelah animasi hati selesai & stiker tampil (satu kali saja, tanpa tulisan saat animasi) */
  await sleep(Math.max(0, Math.max(iconsStart + 3500, heartT0 + 12800) - performance.now()));
  setHint([clickables.length ? KARTU.PETUNJUK_GALAKSI_1 : '', KARTU.PETUNJUK_GALAKSI_2].map(t => fill(t)).filter(Boolean).join('\n'));
  Memo.ready = true;   // tulisan di tengah hati baru bisa diketuk setelah semua animasi selesai
}

/* ========================================================================
   LOOP RENDER
   ======================================================================== */
let last = performance.now();
const v3 = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; U.uTime.value += dt;
  bg.rotation.y += dt * .004; galaxySpin.rotation.y += dt * .018;
  /* warp */
  let speed = 0, streakI = 0;
  if (warp.active) {
    const p = clamp((now - warp.t0) / warp.dur, 0, 1), e = easeIO3(p);
    const z = warp.startPos.z + (warp.finalPos.z - warp.startPos.z) * e;
    camera.position.set(Math.sin(p * Math.PI) * 150 * (1 - e) + warp.finalPos.x * e, warp.startPos.y + (warp.finalPos.y - warp.startPos.y) * e, z);
    camera.lookAt(0, LOOK_Y * e, 0);
    speed = Math.abs(z - warp.prevZ) / Math.max(dt, .001); warp.prevZ = z;
    streakI = clamp(speed / 650, 0, 1) * .85;
    const dist = camera.position.length(), a = smooth(0, 1, clamp((2300 - dist) / 1900, 0, 1));
    GA.value = a; galaxyTilt.visible = a > .001; [coreGlow, coreGlow2].forEach(s => { s.visible = a > .001; s.material.opacity = a * s.userData.op; });
    holeRing.visible = a > .001; holeRing.material.opacity = a;
    if (p >= 1) { warp.active = false; strMat.opacity = 0; GA.value = 1; onArrive(); }
  }
  updateStreaks(speed, dt, streakI);
  refreshKodeNow();
  /* hati */
  if (heartT0 !== null) {
    const t = (now - heartT0) / 1000; heartMat.uniforms.uT.value = t;
    const ph = (t * 1.1) % 1; heartMat.uniforms.uBeat.value = 1 + .028 * Math.exp(-ph * 7) * Math.sin(ph * Math.PI * 1.0 + .5) * (t > 10 ? 1 : 0) + (t > 10 ? .012 * Math.sin(t * 2.2) : 0);
    heartGlow.material.opacity = smooth(3, 11, t) * (.32 + .08 * Math.sin(t * 2.2));
    heartPts.rotation.y = .32 * Math.sin(t * .28) * smooth(8, 14, t);
  }
  /* ikon emoji */
  if (iconsStart !== null) {
    const hov = (state.stage === 'explore' && !Modal.isOpen) ? hoverIcon : null;
    clickables.forEach((it, i) => {
      const k = clamp((now - iconsStart - i * 450) / 1500, 0, 1); it.k = k;
      const sc = it.size * easeOutBack(k) * (1 + .22 * it.hover); it.hover += ((hov === it ? 1 : 0) - it.hover) * .15;
      it.sp.scale.set(Math.max(sc, .01), Math.max(sc, .01), 1); it.sp.material.opacity = k;
      it.sp.position.set(it.base.x, it.base.y + Math.sin(U.uTime.value * 1.1 + it.ph) * 1.3, it.base.z);
      it.halo.position.copy(it.sp.position); const hs = it.size * 2.1 * (1 + .12 * Math.sin(U.uTime.value * 2.2 + it.ph)); it.halo.scale.set(hs * k, hs * k, 1); it.halo.material.opacity = k * (.55 + .3 * it.hover);
    });
    decorGroup.rotation.y += dt * .012;
    decor.forEach((it, i) => {
      const k = clamp((now - iconsStart - 1000 - Math.min(i * 130, 5500)) / 1800, 0, 1), sc = it.size * easeOutBack(k);
      it.sp.scale.set(Math.max(sc, .01), Math.max(sc, .01), 1); it.sp.material.opacity = k * .95;
      it.sp.position.y = it.base.y + Math.sin(U.uTime.value * .8 + it.ph) * 1.6;
    });
  }
  /* hover */
  if (ptrMoved && state.stage === 'explore' && !Modal.isOpen) {
    ptrMoved = false; const h = pickIcon(); hoverIcon = h;
    if (h) { tip.textContent = h.def.label + (document.body.classList.contains('show-kode') ? '  [' + h.def.code + ']' : ''); tip.classList.add('in'); canvas.style.cursor = 'pointer'; }
    else if (pickHeartText()) { tip.textContent = KARTU.LABEL_FOTO + (document.body.classList.contains('show-kode') ? '  [4I]' : ''); tip.classList.add('in'); canvas.style.cursor = 'pointer'; }
    else { tip.classList.remove('in'); canvas.style.cursor = 'grab'; }
  }
  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  U.uScale.value = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(30))); if (Puzzle.board) Puzzle.sizeBoard();
  if (state.stage === 'explore') placeTitle();
});

/* ========================================================================
   [KODE: LOAD-01..06] ALUR UTAMA
   ======================================================================== */
(async function main() {
  $('#loader').classList.add('show');
  await sleep(700);
  const loading = loadAll();
  await typeEl($('#load-title'), KARTU.TEKS_LOADING, { keepCaret: true });
  $('#load-wrap').classList.add('in');
  let shown = 0;
  await new Promise(res => {
    const tick = () => {
      const t = totalProgress() * 100;
      if (store.fatal) return res();
      shown += Math.max((t - shown) * .07, t > shown ? .12 : 0); if (shown > t) shown = t;
      $('#load-pct').textContent = Math.floor(shown) + '%'; $('#load-fill').style.width = shown + '%';
      if (shown >= 99.9 && t >= 100) return res();
      requestAnimationFrame(tick);
    };
    tick();
  });
  await loading;
  if (store.fatal) { await typeEl($('#load-note'), store.fatal, { speed: 25 }); return; }
  $('#load-pct').textContent = '100%'; $('#load-fill').style.width = '100%';
  startMusic();                                     /* musik langsung diputar begitu loading selesai */
  if (store.notes.length) { await sleep(400); await typeEl($('#load-note'), store.notes.join(' '), { speed: 25 }); }
  await sleep(900);
  $('#loader').classList.remove('show');
  if (KARTU.AKTIF_PUZZLE === false) { state.stage = 'puzzle'; enterGalaxy(); return; }
  await Puzzle.init();
  await sleep(1300);
  state.stage = 'puzzle';
  $('#puzzle').classList.add('show');
  await sleep(900);
  typeEl($('#pzl-title'), fill(KARTU.JUDUL_PUZZLE));
  await sleep(1400);
  $('#pzl-board').classList.add('in');
  await typeEl($('#pzl-sub'), KARTU.PETUNJUK_PUZZLE);
})();
